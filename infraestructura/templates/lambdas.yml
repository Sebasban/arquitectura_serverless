AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Crea dos Lambdas para el microservicio de eventos.

Parameters:
  Environment:
    Type: String
    Description: "Texto adicional para el nombre del bucket (ej: dev, qc, pdn)"
    Default: "dev"
    AllowedValues: ["dev", "qc", "pdn"]

  EventTableName:
    Type: String
    Description: "Nombre de la tabla DynamoDB (ej: EventTable)"
    Default: "EventTable"

  SchedulerRoleArn:
    Type: String

  UpdateLambdaFunctionArn:
    Type: String
    Description: ARN de la Lambda destino a invocar por el Scheduler (p.ej. UpdateEventLambda).

  QueueMailsBuyArn:
    Type: String
    Description: Arn de la cola de sqs

  FromEmail:
    Type: String
    Description: Correo electronico del cual saldra el correo

  ACCOUNT:
    Type: String
    Description: ID de la cuenta

Resources:

  ## ROLE PARA EventLambda ##
  EventLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'EventLambdaModificationPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Logging
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                Resource: '*'
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/EventLambda:*"

              # DynamoDB Access
              - Effect: 'Allow'
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:UpdateItem'
                  - 'dynamodb:DeleteItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:Scan'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:DescribeTable'
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}/index/*"

              # EventBridge Scheduler
              - Effect: 'Allow'
                Action:
                  - 'scheduler:CreateSchedule'
                  - 'scheduler:DeleteSchedule'
                  - 'scheduler:GetSchedule'
                  - 'scheduler:ListSchedules'
                  - 'scheduler:UpdateSchedule'
                Resource: '*'

              # Permiso para pasar rol
              - Effect: 'Allow'
                Action:
                  - 'iam:PassRole'
                Resource: !Ref SchedulerRoleArn

  ## LOG GROUP PARA EventLambda ##
  EventLambdaLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/aws/lambda/EventLambda"
      RetentionInDays: 30

  ## LAMBDA PRINCIPAL ##
  EventLambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: EventLambdaLogGroup
    Properties:
      FunctionName: 'EventLambda'
      Handler: 'events_lambda.lambda_handler'
      Runtime: python3.12
      Code:
        S3Bucket: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"
        S3Key: "scripts_aplication/events_lambda.py.zip"
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt EventLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref EventTableName
          REGION: !Ref 'AWS::Region'
          LOG_LEVEL: "INFO"
          SCHEDULEARN: !Ref SchedulerRoleArn
          UPDATEARNFUNCTION: !Ref UpdateLambdaFunctionArn


  ## ROLE PARA UPDATE LAMBDA ##
  UpdateEventLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: LambdaUpdateEventRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
          # DynamoDB Access
              - Effect: 'Allow'
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:UpdateItem'
                  - 'dynamodb:DeleteItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:Scan'
                  - 'dynamodb:GetItem' 
                  - 'dynamodb:DescribeTable'
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}/index/*"

  ## LOG GROUP PARA UPDATE LAMBDA ##
  UpdateEventLambdaLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/aws/lambda/UpdateLambda"
      RetentionInDays: 30

  ## LAMBDA PARA ACTUALIZACIÓN DE EVENTOS ##
  UpdateEventLambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: UpdateEventLambdaLogGroup
    Properties:
      FunctionName: 'UpdateEventLambda'
      Handler: 'update_event_lambda.lambda_handler'
      Runtime: python3.12
      Code:
        S3Bucket: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"
        S3Key: "scripts_aplication/update_event_lambda.py.zip"
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt UpdateEventLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref EventTableName
          REGION: !Ref 'AWS::Region'
          LOG_LEVEL: "INFO"

  ## ROLE PARA UPDATE LAMBDA ##
  SearchEventLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: LambdaSearchEventRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
          # DynamoDB Access
              - Effect: 'Allow'
                Action:
                  - 'dynamodb:Query'
                  - 'dynamodb:Scan'
                  - 'dynamodb:GetItem' 
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}/index/*"

  ## LOG GROUP PARA UPDATE LAMBDA ##
  SearchEventLambdaLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/aws/lambda/SearchLambda"
      RetentionInDays: 30

  ## LAMBDA PARA ACTUALIZACIÓN DE EVENTOS ##
  SearchEventLambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: SearchEventLambdaLogGroup
    Properties:
      FunctionName: 'SearchEventLambda'
      Handler: 'search_lambda.lambda_handler'
      Runtime: python3.12
      Code:
        S3Bucket: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"
        S3Key: "scripts_aplication/search_lambda.py.zip"
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt SearchEventLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref EventTableName
          REGION: !Ref 'AWS::Region'
          LOG_LEVEL: "INFO"

  ## ROLE PARA UPDATE LAMBDA ##
  PutUserLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: LambdaPutUserRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
          # DynamoDB Access
              - Effect: 'Allow'
                Action:
                  - 'dynamodb:Query'
                  - 'dynamodb:UpdateItem'
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventTableName}/index/*"

              - Effect: 'Allow'
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref QueueMailsBuyArn

  ## LOG GROUP PARA UPDATE LAMBDA ##
  PutUserLambdaLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/aws/lambda/PutUserLambda"
      RetentionInDays: 30

  ## LAMBDA PARA ACTUALIZACIÓN DE EVENTOS ##
  PutUserLambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: PutUserLambdaLogGroup
    Properties:
      FunctionName: 'PutUserLambda'
      Handler: 'publish_event.lambda_handler'
      Runtime: python3.12
      Code:
        S3Bucket: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"
        S3Key: "scripts_aplication/publish_event.py.zip"
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt PutUserLambdaRole.Arn 
      Environment:
        Variables:
          TABLE_NAME: !Ref EventTableName
          REGION: !Ref 'AWS::Region'
          LOG_LEVEL: "INFO"
          ACCOUNT: !Ref ACCOUNT


  ## ROLE PARA UPDATE LAMBDA ##
  SendMailLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: LambdaSendMailRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility 
                Resource:
                  - !Ref QueueMailsBuyArn
              - Effect: Allow
                Action:
                  - ses:SendEmail #Sin adjuntos
                  - ses:SendRawEmail #Con adjuntos
                Resource: "*"

  ## LOG GROUP PARA UPDATE LAMBDA ##
  SendMailLambdaLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/aws/lambda/SendEmailLambda"
      RetentionInDays: 30

  ## LAMBDA PARA ACTUALIZACIÓN DE EVENTOS ##
  SendMailLambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: SendMailLambdaLogGroup
    Properties:
      FunctionName: 'SendMailLambda'
      Handler: 'send_mail.lambda_handler'
      Runtime: python3.12
      Code:
        S3Bucket: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"
        S3Key: "scripts_aplication/send_email.py.zip"
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt SendMailLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref EventTableName
          REGION: !Ref 'AWS::Region'
          LOG_LEVEL: "INFO"
          FROM_EMAIL: !Ref FromEmail

  SQSTriggerLambda:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref QueueMailsBuyArn
      FunctionName: !GetAtt SendMailLambdaFunction.Arn   # ARN o nombre funcionan; tú ya pasas el ARN
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5


Outputs:
  LambdaName:
    Description: Nombre de la función Lambda de eventos 
    Value: !Ref EventLambdaFunction

  LambdaArn:
    Description: ARN de la función Lambda de eventos
    Value: !GetAtt EventLambdaFunction.Arn

  LambdaSearchArn:
    Description: ARN de la función Lambda de busqueda
    Value: !GetAtt SearchEventLambdaFunction.Arn

  LambdaPutUserArn:
    Description: ARN de la función Lambda
    Value: !GetAtt PutUserLambdaFunction.Arn

  LogGroupName:
    Description: Log group de CloudWatch
    Value: "/aws/lambda/EventLambda"

  CodeBucket:
    Description: Bucket de código Lambda
    Value: !Sub "lambda-code-${AWS::AccountId}-${AWS::Region}-${Environment}"

  UpdateLambdaArn:
    Description: ARN de la función Lambda de actualización
    Value: !GetAtt UpdateEventLambdaFunction.Arn 
