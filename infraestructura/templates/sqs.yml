Parameters:
  SendMailLambdaArn:
    Type: String
    Description: ARN de la Lambda que procesa la cola (p. ej. arn:aws:lambda:us-east-1:...:function:SendMailLambda)
  SendMailLambdaName:
    Type: String
    Description: Nombre de la Lambda (p. ej. SendMailLambda)  # (corrige la descripción si decía ARN)

Resources:
  QueueMailsBuy:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: QueueMailsBuy

  SQSTriggerLambda:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt QueueMailsBuy.Arn
      FunctionName: !Ref SendMailLambdaArn   # ARN o nombre funcionan; tú ya pasas el ARN
      Enabled: true
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
