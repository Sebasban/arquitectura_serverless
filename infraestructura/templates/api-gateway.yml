AWSTemplateFormatVersion: '2010-09-09'
Description: REST API -> Lambda proxy (/event con POST, PUT, DELETE, GET) + API Key

Parameters:
  LambdaArn:
    Type: String
  
  LambdaSearchArn:
    Type: String

  LambdaPutUserArn:
    Type: String

  ApiKeyName:
    Type: String
    Default: events-api-key
    Description: Nombre del API Key a crear

  ApiKeyValue:
    Type: String
    Default: ""
    NoEcho: true
    Description: "(Opcional) Valor fijo del API Key. Déjalo vacío para que AWS lo genere."

Conditions:
  HasApiKeyValue: !Not [!Equals [!Ref ApiKeyValue, ""]]

Resources:
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: EventManagementAPI
      Description: API Gateway para CRUD de Event Management y User Management Lambdas

  ApiGatewayResourceEvent:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: event
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayMethodEventPost:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: POST
      ResourceId: !Ref ApiGatewayResourceEvent
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

  ApiGatewayMethodEventGet:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: GET
      ResourceId: !Ref ApiGatewayResourceEvent
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

  ApiGatewayMethodEventPut:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: PUT
      ResourceId: !Ref ApiGatewayResourceEvent
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

  ApiGatewayMethodEventDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: DELETE
      ResourceId: !Ref ApiGatewayResourceEvent
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations

  ApiGatewayResourceUser:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: User
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayMethodUsertGet:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: false
      HttpMethod: GET
      ResourceId: !Ref ApiGatewayResourceUser
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaSearchArn}/invocations

  ApiGatewayMethodUsertPut:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      ApiKeyRequired: false
      HttpMethod: PUT
      ResourceId: !Ref ApiGatewayResourceUser
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaPutUserArn}/invocations

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodEventPost
      - ApiGatewayMethodEventPut
      - ApiGatewayMethodEventDelete
      - ApiGatewayMethodEventGet
      - ApiGatewayMethodUsertGet
      - ApiGatewayMethodUsertPut
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: prod

  EventsApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Ref ApiKeyName
      Enabled: true
      Value: !If [HasApiKeyValue, !Ref ApiKeyValue, !Ref AWS::NoValue]

  EventsUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiGatewayDeployment
    Properties:
      UsagePlanName: events-usage-plan
      ApiStages:
        - ApiId: !Ref ApiGatewayRestApi
          Stage: prod

  EventsUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref EventsApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref EventsUsagePlan

  LambdaInvokePermissionEvent:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*/*

  LambdaInvokePermissionUserSearch:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaSearchArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*/*

LambdaInvokePermissionUserPut:
  Type: AWS::Lambda::Permission
  Properties:
    Action: lambda:InvokeFunction
    FunctionName: !Ref LambdaPutUserArn
    Principal: apigateway.amazonaws.com
    SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*/*


Outputs:
  ApiGatewayUrl:
    Description: URL base
    Value: !Sub https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod

  EventEndpoint:
    Description: Endpoint /event (POST, PUT, DELETE, GET)
    Value: !Sub https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/event

  ApiKeyId:
    Description: ID del API Key (usa este ID para leer el valor si no lo fijaste)
    Value: !Ref EventsApiKey
